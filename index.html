// ============================================================
// LIVE — shared dashboard during the event.
// Same page on the big screen and on every phone: giant timer, 4 atelier
// cards with the currently-present group, QR for late joiners. During the
// 5-min transition we display the NEXT rotation so groups see where to head.
// A personal strip at the top lets participants pick their group and then
// see their own next stop; the big screen simply never picks one.
// ============================================================
function renderLivePersonalStrip(myGroup) {
  // Case 1 — not picked yet: render the group picker.
  if (myGroup === null) {
    return `
      <div class="cap-status" style="max-width:980px;margin:20px auto 0;padding:20px 24px">
        <div class="kicker">Suivez en direct</div>
        <div style="font-family:var(--font-display);font-size:clamp(22px,3vw,30px);
                    font-style:italic;color:var(--terracotta);position:relative;
                    margin:4px 0 16px;font-weight:400;letter-spacing:-0.01em">
          Vous êtes dans quel groupe&nbsp;?
        </div>
        <div data-picker-grid style="display:grid;grid-template-columns:repeat(${N_GROUPS},minmax(0,1fr));
                    gap:10px;position:relative">
          ${state.config.groups.map(g => `
            <button data-pick-group="${g.id}"
              style="background:rgba(251,249,244,0.08);border:1.5px solid rgba(251,249,244,0.22);
                     color:var(--card);border-radius:12px;padding:14px 12px;cursor:pointer;
                     transition:background 0.15s, border-color 0.15s;
                     text-align:left;font-family:inherit">
              <div style="font-family:var(--font-display);font-size:18px;font-weight:500;line-height:1.1">
                ${escapeHtml(g.name)}
              </div>
              <div style="font-size:12px;color:var(--terracotta);font-style:italic;margin-top:4px;
                          font-family:var(--font-display);font-weight:400;min-height:1em">
                ${g.captain ? escapeHtml(g.captain) : '<span style="opacity:0.4">—</span>'}
              </div>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }

  // Case 2 — group picked: render the personal banner.
  const g = state.config.groups[myGroup];
  // During transition, the group is heading to the next rotation's atelier; show
  // that as "Direction" (current focus), and rotation after as "Ensuite".
  const focusRotation = (state.phase === 'transition' && state.currentRotation < N_ROTATIONS)
    ? state.currentRotation + 1
    : state.currentRotation;
  const cur = (focusRotation >= 1 && focusRotation <= N_ROTATIONS)
    ? getGroupAtelierForRotation(myGroup, focusRotation) : null;
  const nxt = (focusRotation + 1 >= 1 && focusRotation + 1 <= N_ROTATIONS)
    ? getGroupAtelierForRotation(myGroup, focusRotation + 1) : null;

  const changeBtn = `
    <button data-change-group aria-label="Changer de groupe"
      style="display:block;width:100%;margin-top:16px;padding:12px;
             background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.35);
             color:#fff;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
             letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;
             transition:background 0.15s">
      Changer de groupe
    </button>`;

  // Idle — before the admin launches rotation 1.
  if (state.currentRotation === 0) {
    const scheduleRows = Array.from({length: N_ROTATIONS}, (_, i) => {
      const a = getGroupAtelierForRotation(myGroup, i + 1);
      if (!a) return '';
      return `
        <div style="display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;
                    padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.12)">
          <div style="font-family:var(--font-display);font-size:13px;font-weight:500;
                      color:rgba(251,249,244,0.55);letter-spacing:0.05em;padding-top:2px">Rot. ${i+1}</div>
          <div>
            <div style="font-family:var(--font-display);font-size:17px;font-weight:500;
                        color:var(--card);letter-spacing:-0.01em">${escapeHtml(a.name)}</div>
            <div style="font-size:12px;color:var(--terracotta);font-style:italic;
                        font-family:var(--font-display);margin-top:2px">→ ${escapeHtml(a.location)}</div>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="cap-status" style="max-width:980px;margin:20px auto 0;padding:20px 24px">
        <div class="kicker">Votre groupe · En attente du lancement</div>
        <div class="cap-status-name" style="position:relative;margin-bottom:16px">${escapeHtml(groupDisplayName(g))}</div>
        <div style="font-size:10px;letter-spacing:0.25em;text-transform:uppercase;
                    color:rgba(251,249,244,0.5);margin-bottom:8px;font-weight:500">Votre parcours</div>
        ${scheduleRows}
        ${changeBtn}
      </div>
    `;
  }

  // Finished.
  if (state.currentRotation > N_ROTATIONS) {
    return `
      <div class="cap-status" style="max-width:980px;margin:20px auto 0;padding:20px 24px">
        <div class="kicker">Votre groupe</div>
        <div class="cap-status-name" style="position:relative">${escapeHtml(groupDisplayName(g))}</div>
        <div style="position:relative;margin-top:10px;color:rgba(251,249,244,0.85);
                    font-size:15px;font-style:italic;font-family:var(--font-display)">
          L'instant est terminé. Merci d'avoir été là.
        </div>
        ${changeBtn}
      </div>
    `;
  }

  // Running: show where to be now + what comes next.
  const curLabel = state.phase === 'transition' ? 'Direction' : 'Vous êtes à';
  return `
    <div class="cap-status" style="max-width:980px;margin:20px auto 0;padding:20px 24px">
      <div class="kicker" style="position:relative">
        ${escapeHtml(groupDisplayName(g))} · Rotation ${state.currentRotation} sur ${N_ROTATIONS}
      </div>
      <div data-personal-grid style="display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start;
                  position:relative;margin-top:10px">
        <div>
          <div class="atelier-teams-label" style="color:rgba(251,249,244,0.55);margin-bottom:2px">${curLabel}</div>
          ${cur ? `
            <div style="display:flex;align-items:baseline;gap:14px;margin-top:4px">
              <div class="cap-status-letter" style="font-size:56px;line-height:0.85">${cur.key}</div>
              <div style="min-width:0">
                <div class="cap-status-name" style="font-size:24px;margin-top:0">${escapeHtml(cur.name)}</div>
                <div style="margin-top:6px;font-size:14px;color:var(--terracotta);font-style:italic;
                            font-family:var(--font-display);font-weight:500">→ ${escapeHtml(cur.location)}</div>
              </div>
            </div>
          ` : `
            <div class="cap-status-name" style="font-size:22px;margin-top:8px">Transition</div>
          `}
        </div>
        <div style="border-left:1px solid rgba(251,249,244,0.18);padding-left:24px">
          <div class="atelier-teams-label" style="color:rgba(251,249,244,0.55);margin-bottom:2px">Ensuite</div>
          ${nxt ? `
            <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px">
              <div style="font-family:var(--font-display);font-size:40px;font-style:italic;
                          color:var(--gold);line-height:0.85">${nxt.key}</div>
              <div style="min-width:0">
                <div style="font-family:var(--font-display);font-size:18px;font-weight:500;letter-spacing:-0.01em">
                  ${escapeHtml(nxt.name)}
                </div>
                <div style="font-size:12px;color:rgba(251,249,244,0.7);font-style:italic;
                            font-family:var(--font-display);margin-top:2px">→ ${escapeHtml(nxt.location)}</div>
              </div>
            </div>
          ` : `
            <div style="margin-top:10px;font-size:14px;color:rgba(251,249,244,0.7);
                        font-style:italic;font-family:var(--font-display)">
              Dernier atelier — profitez-en.
            </div>
          `}
        </div>
      </div>
      ${changeBtn}
    </div>
  `;
}

function renderLive() {
  const remaining = getTimerRemaining();
  const myGroup = getMyGroup();

  const phaseLabel =
    state.phase === 'epreuve'    ? 'Atelier en cours' :
    state.phase === 'transition' ? 'On change d\'atelier' :
    state.currentRotation === 0           ? 'Avant le lancement' :
    state.currentRotation > N_ROTATIONS   ? 'C\'est terminé' :
                                            'En pause';
  const phaseClass =
    state.phase === 'epreuve'    ? 'active-epreuve' :
    state.phase === 'transition' ? 'active-transition' : '';

  const kickerText =
    state.currentRotation === 0         ? 'Un instant, l\'instant arrive' :
    state.currentRotation > N_ROTATIONS ? 'Merci d\'avoir été là' :
    `Rotation ${Math.min(state.currentRotation, N_ROTATIONS)} sur ${N_ROTATIONS}`;

  // During transition, show who's heading to each atelier (the upcoming rotation).
  const displayedRotation = (state.phase === 'transition' && state.currentRotation < N_ROTATIONS)
    ? state.currentRotation + 1
    : state.currentRotation;
  const assignments = getAssignmentsForRotation(displayedRotation);
  const presentLabel = state.phase === 'transition' ? 'Accueille bientôt' : 'Groupe présent';

  const currentUrl = window.location.origin + window.location.pathname;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=${encodeURIComponent(currentUrl)}`;

  const rotationDots = [];
  for (let i = 1; i <= N_ROTATIONS; i++) {
    const cls = i < state.currentRotation ? 'done' :
                i === state.currentRotation ? 'current' : '';
    rotationDots.push(`<div class="rotation-dot ${cls}">${i}</div>`);
    if (i < N_ROTATIONS) rotationDots.push(`<div class="rotation-line"></div>`);
  }

  return `
    ${renderLivePersonalStrip(myGroup)}
    <div class="screen fade-in">
      <div class="screen-header">
        <div class="screen-title-block">
          <div class="kicker">${escapeHtml(kickerText)}</div>
          <h1>Un instant<br/><em>de vérité</em></h1>
        </div>
        <div class="timer-block">
          <div class="timer-phase ${phaseClass}">${phaseLabel}</div>
          <div class="timer-display ${state.timerPaused ? 'paused' : ''}" data-timer>${formatTime(remaining)}</div>
        </div>
      </div>

      <div class="rotation-indicator">${rotationDots.join('')}</div>

      <div class="ateliers-grid">
        ${ATELIERS.map(a => {
          const gId = assignments[a.key];
          const g = (gId !== undefined && gId !== null) ? state.config.groups[gId] : null;
          const hasGroup = !!g;
          const isMine = myGroup !== null && gId === myGroup;
          const mineStyle = isMine
            ? 'box-shadow:0 0 0 3px var(--terracotta), 0 8px 24px rgba(14,26,51,0.18);'
            : '';
          return `
            <div class="atelier-card ${hasGroup ? 'highlight' : ''}" style="${mineStyle}">
              <div class="atelier-header">
                <div class="atelier-letter">${a.key}</div>
                <div class="atelier-name">${escapeHtml(a.name)}</div>
                ${isMine ? `
                  <span style="margin-left:auto;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;
                               color:var(--terracotta);background:rgba(184,147,51,0.18);padding:4px 9px;
                               border-radius:999px;font-weight:500;align-self:flex-start">
                    Votre groupe
                  </span>
                ` : ''}
              </div>
              <div class="atelier-teams-label" style="margin-top:4px">Lieu</div>
              <div class="atelier-teams" style="font-family:var(--font-display);font-style:italic;font-weight:500">
                ${escapeHtml(a.location)}
              </div>
              <div class="atelier-teams-label" style="margin-top:14px">${presentLabel}</div>
              <div class="${hasGroup ? 'atelier-teams' : 'atelier-teams-empty'}">
                ${hasGroup ? escapeHtml(groupDisplayName(g)) : '—'}
              </div>
              <div class="atelier-teams-label" style="margin-top:14px">Avec</div>
              <div class="atelier-teams" style="font-weight:400">
                ${escapeHtml(a.responsible)}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="screen-footer">
        <div class="screen-footer-text">
          <div class="kicker">Scannez pour suivre en direct</div>
          <div class="url">${escapeHtml(currentUrl)}</div>
        </div>
        <div class="qr-box">
          <img src="${qrUrl}" alt="QR Code" />
        </div>
      </div>
    </div>
  `;
}

// ============================================================
// ADMIN — organiser console (chrono controls + group config)
// ============================================================
function renderAdminLogin() {
  return `
    <div class="mobile-view fade-in">
      <div class="mobile-header">
        <div class="kicker">Accès restreint</div>
        <h1>Console<br/><em>organisatrice</em></h1>
      </div>
      <div class="login-card">
        <label class="form-label">Code d'accès</label>
        <input type="password" id="admin-code-input" placeholder="Code organisatrice" autocomplete="off" />
        <div class="error-msg" id="admin-error" style="display:none"></div>
        <button class="submit-btn" data-action="admin-login">Accéder à la console</button>
      </div>
    </div>
  `;
}

function renderAdmin() {
  const adminSession = (window.getSessionAdmin || getSessionAdmin)();
  if (!adminSession) return renderAdminLogin();

  const remaining = getTimerRemaining();
  const phaseLabel =
    state.phase === 'epreuve'    ? 'Atelier' :
    state.phase === 'transition' ? 'Transition' : 'En attente';

  const displayRot = state.currentRotation > N_ROTATIONS
    ? N_ROTATIONS : state.currentRotation;

  return `
    <div class="admin-view fade-in">
      <div class="admin-header">
        <h1>Un instant <em>de vérité</em></h1>
        <div style="text-align:right">
          <div style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted)">Rotation</div>
          <div style="font-family:var(--font-display);font-size:32px;font-weight:500;color:var(--accent)">${displayRot}/${N_ROTATIONS}</div>
          <div style="margin-top:6px;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:${storageMode === 'supabase' ? 'var(--accent-soft)' : 'var(--terracotta)'}">
            ${storageMode === 'supabase' ? '● Sync Supabase' : '● Mode local uniquement'}
          </div>
        </div>
      </div>

      <div class="admin-controls">
        ${state.phase === 'idle' && state.currentRotation === 0 ? `
          <button class="admin-btn primary" data-action="start">▶ Lancer la rotation 1</button>
        ` : state.phase === 'idle' && state.currentRotation > N_ROTATIONS ? `
          <button class="admin-btn" data-action="reset-event">Redémarrer l'événement</button>
        ` : state.phase === 'idle' ? `
          <button class="admin-btn primary" data-action="start">▶ Lancer rotation ${state.currentRotation + 1}</button>
        ` : ''}

        ${state.phase !== 'idle' ? `
          ${state.timerPaused
            ? `<button class="admin-btn primary" data-action="resume">▶ Reprendre</button>`
            : `<button class="admin-btn" data-action="pause">⏸ Pause</button>`
          }
          <button class="admin-btn" data-action="skip-phase">
            Passer à ${state.phase === 'epreuve' ? 'la transition' : 'la rotation suivante'}
          </button>
        ` : ''}

        <button class="admin-btn" data-action="goto-screen">Ouvrir le live</button>
        <button class="admin-btn danger" data-action="reset-all">Tout réinitialiser</button>
      </div>

      <div class="admin-grid">
        <div class="admin-section">
          <h2>Minuteur</h2>
          <div class="admin-timer">
            <div class="admin-timer-value" data-timer>${formatTime(remaining)}</div>
            <div class="admin-timer-label">${phaseLabel}${state.timerPaused ? ' · en pause' : ''}</div>
          </div>
          <div class="admin-state-info">
            <div class="admin-state-row">
              <div class="admin-state-label">Durée atelier</div>
              <div class="admin-state-value">35:00</div>
            </div>
            <div class="admin-state-row">
              <div class="admin-state-label">Transition</div>
              <div class="admin-state-value">5:00</div>
            </div>
            <div class="admin-state-row">
              <div class="admin-state-label">Durée totale</div>
              <div class="admin-state-value">2h40</div>
            </div>
          </div>
          <div style="margin-top:16px">
            <div class="admin-state-label" style="margin-bottom:8px">Aller directement à la rotation…</div>
            <div class="admin-rot-buttons" style="grid-template-columns:repeat(${N_ROTATIONS}, 1fr)">
              ${Array.from({length: N_ROTATIONS}, (_, i) => i + 1).map(r => `
                <button class="admin-rot-btn ${r === state.currentRotation ? 'current' : ''}"
                        data-action="goto-rot" data-rot="${r}">${r}</button>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="admin-section">
          <h2>Planning des rotations</h2>
          <div style="font-size:12px;color:var(--muted);margin-bottom:12px">
            Chaque groupe passe une fois dans chaque atelier. La rotation en cours est mise en valeur.
          </div>
          <table style="width:100%;font-size:13px;border-collapse:collapse">
            <thead>
              <tr style="border-bottom:1.5px solid var(--line)">
                <th style="text-align:left;padding:8px 6px;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0.1em;text-transform:uppercase">Rot.</th>
                ${ATELIERS.map(a => `<th style="padding:8px 6px;color:var(--muted);font-weight:500;text-align:center;font-size:11px;letter-spacing:0.1em;text-transform:uppercase">Atelier ${a.key}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${SCHEDULE.map((row, r) => {
                const isCurrent = (r + 1) === state.currentRotation;
                return `
                  <tr style="border-bottom:1px solid var(--line);${isCurrent ? 'background:rgba(184,147,51,0.08)' : ''}">
                    <td style="padding:10px 6px;font-family:var(--font-display);font-weight:500;${isCurrent ? 'color:var(--terracotta)' : ''}">${r+1}</td>
                    ${row.map(gId => {
                      const g = state.config.groups[gId];
                      const name = g.captain ? `${gId+1} · ${escapeHtml(g.captain)}` : `Groupe ${gId+1}`;
                      return `<td style="padding:10px 6px;text-align:center;font-size:12px;font-family:var(--font-display);font-weight:500">${name}</td>`;
                    }).join('')}
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="admin-section" style="margin-top:24px">
        <h2>Groupes & capitaines</h2>
        <div class="setup-hint">
          Les prénoms des capitaines sont visibles sur le sélecteur de groupe du live, pour aider chacune à reconnaître le sien.
        </div>
        <div class="admin-config">
          <div class="admin-config-col">
            <h3>Groupes</h3>
            ${state.config.groups.map((g, i) => `
              <div class="admin-config-row">
                <span class="prefix">${i+1}</span>
                <input class="admin-config-input" type="text" value="${escapeAttr(g.name)}"
                       placeholder="Nom du groupe"
                       data-config="group-name" data-idx="${i}" />
                <input class="admin-config-input" type="text" value="${escapeAttr(g.captain || '')}"
                       placeholder="Capitaine"
                       data-config="group-captain" data-idx="${i}" />
              </div>
            `).join('')}
          </div>
          <div class="admin-config-col">
            <h3>Ateliers (fixes)</h3>
            ${ATELIERS.map(a => `
              <div class="admin-config-row">
                <span class="prefix">${a.key}</span>
                <input class="admin-config-input" type="text" value="${escapeAttr(a.name)} · ${escapeAttr(a.location)}"
                       disabled title="Défini en dur dans ATELIERS" />
              </div>
            `).join('')}
          </div>
        </div>
        <div style="margin-top:20px">
          <button class="admin-btn" data-action="admin-logout">Se déconnecter</button>
        </div>
      </div>
    </div>
  `;
}

// ============================================================
// CUSTOM CONFIRM & TOAST (native confirm is blocked in sandboxed iframes)
// ============================================================
function showConfirm(title, message, { danger = false, confirmLabel = 'Confirmer', cancelLabel = 'Annuler' } = {}) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card" role="dialog" aria-modal="true">
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="modal-btn cancel">${escapeHtml(cancelLabel)}</button>
          <button class="modal-btn confirm ${danger ? 'danger' : ''}">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const done = (v) => { overlay.remove(); resolve(v); };
    overlay.querySelector('.cancel').onclick = () => done(false);
    overlay.querySelector('.confirm').onclick = () => done(true);
    overlay.onclick = (e) => { if (e.target === overlay) done(false); };
  });
}

function showToast(message, duration = 2500) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), duration);
}

// ============================================================
// UTIL (html escaping) — placed here so render functions can use it.
// ============================================================
function escapeHtml(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

// ============================================================
// EVENT HANDLERS (minimal — full wiring lands at step 9)
// Covers the briefing carousel, participants calc and captain names so slides
// 1-7 of the projection are already interactive.
// ============================================================
function attachEventHandlers(route) {
  // Live — pick or change group (stored in localStorage)
  document.querySelectorAll('[data-pick-group]').forEach(btn => {
    btn.onclick = () => {
      const id = parseInt(btn.dataset.pickGroup, 10);
      if (!isNaN(id)) setMyGroup(id);
      render();
    };
  });
  document.querySelectorAll('[data-change-group]').forEach(btn => {
    btn.onclick = () => { setMyGroup(null); render(); };
  });

  // Briefing: prev / next / jump via dot / jump to live
  document.querySelectorAll('[data-brief-action]').forEach(btn => {
    btn.onclick = () => {
      const action = btn.dataset.briefAction;
      if (action === 'next' && briefingSlide < BRIEFING_SLIDES.length - 1) {
        briefingSlide++;
        render();
      } else if (action === 'prev' && briefingSlide > 0) {
        briefingSlide--;
        render();
      } else if (action === 'live') {
        location.hash = '#/live';
      }
    };
  });
  document.querySelectorAll('[data-brief-go]').forEach(btn => {
    btn.onclick = () => { briefingSlide = parseInt(btn.dataset.briefGo, 10); render(); };
  });

  // Participants calc input (preserves focus via partial update)
  const calcInput = document.getElementById('teams-calc-input');
  if (calcInput) {
    calcInput.oninput = async () => {
      const v = parseInt(calcInput.value, 10);
      state.participantCount = isNaN(v) ? null : v;
      const resEl = document.getElementById('teams-calc-result');
      if (resEl) resEl.innerHTML = renderParticipantsCalcResult(state.participantCount);
      await saveStatePatch({ participantCount: state.participantCount });
    };
  }

  // ===== ADMIN =====
  document.querySelectorAll('[data-action="admin-login"]').forEach(btn => {
    btn.onclick = () => {
      const code = document.getElementById('admin-code-input').value.trim();
      const errEl = document.getElementById('admin-error');
      if (code !== ADMIN_CODE) {
        errEl.textContent = 'Code incorrect.';
        errEl.style.display = 'block';
        return;
      }
      (window.setSessionAdmin || setSessionAdmin)({ ok: true });
      render();
    };
  });
  document.querySelectorAll('[data-action="admin-logout"]').forEach(btn => {
    btn.onclick = () => { (window.setSessionAdmin || setSessionAdmin)(null); render(); };
  });

  document.querySelectorAll('[data-action="start"]').forEach(btn => {
    btn.onclick = async () => {
      if (state.currentRotation === 0) state.currentRotation = 1;
      else state.currentRotation += 1;
      state.phase = 'epreuve';
      state.timerEnd = Date.now() + EPREUVE_DURATION * 1000;
      state.timerPaused = false;
      state.timerRemaining = null;
      await saveStatePatch({
        phase: state.phase, timerEnd: state.timerEnd,
        timerPaused: false, timerRemaining: null,
        currentRotation: state.currentRotation
      });
      render();
    };
  });

  document.querySelectorAll('[data-action="pause"]').forEach(btn => {
    btn.onclick = async () => {
      state.timerRemaining = getTimerRemaining();
      state.timerPaused = true;
      await saveStatePatch({ timerPaused: true, timerRemaining: state.timerRemaining });
      render();
    };
  });

  document.querySelectorAll('[data-action="resume"]').forEach(btn => {
    btn.onclick = async () => {
      state.timerEnd = Date.now() + (state.timerRemaining || 0) * 1000;
      state.timerPaused = false;
      state.timerRemaining = null;
      await saveStatePatch({ timerEnd: state.timerEnd, timerPaused: false, timerRemaining: null });
      render();
    };
  });

  document.querySelectorAll('[data-action="skip-phase"]').forEach(btn => {
    btn.onclick = async () => {
      const ok = await showConfirm(
        'Passer à la phase suivante',
        'Le minuteur va sauter immédiatement à la phase suivante. Confirmer ?',
        { confirmLabel: 'Passer' }
      );
      if (!ok) return;
      if (state.phase === 'epreuve') {
        state.phase = 'transition';
        state.timerEnd = Date.now() + TRANSITION_DURATION * 1000;
        state.timerPaused = false;
      } else if (state.phase === 'transition') {
        if (state.currentRotation < N_ROTATIONS) {
          state.currentRotation += 1;
          state.phase = 'epreuve';
          state.timerEnd = Date.now() + EPREUVE_DURATION * 1000;
          state.timerPaused = false;
        } else {
          state.currentRotation = N_ROTATIONS + 1;
          state.phase = 'idle';
          state.timerEnd = null;
        }
      }
      await saveStatePatch({
        phase: state.phase, timerEnd: state.timerEnd,
        timerPaused: state.timerPaused, timerRemaining: null,
        currentRotation: state.currentRotation
      });
      render();
    };
  });

  document.querySelectorAll('[data-action="goto-rot"]').forEach(btn => {
    btn.onclick = async () => {
      const r = parseInt(btn.dataset.rot, 10);
      const ok = await showConfirm(
        `Aller à la rotation ${r}`,
        'Cela relance immédiatement le minuteur à 35:00 sur cette rotation.',
        { confirmLabel: 'Y aller' }
      );
      if (!ok) return;
      state.currentRotation = r;
      state.phase = 'epreuve';
      state.timerEnd = Date.now() + EPREUVE_DURATION * 1000;
      state.timerPaused = false;
      state.timerRemaining = null;
      await saveStatePatch({
        phase: state.phase, timerEnd: state.timerEnd,
        timerPaused: false, timerRemaining: null,
        currentRotation: state.currentRotation
      });
      render();
    };
  });

  document.querySelectorAll('[data-action="goto-screen"]').forEach(btn => {
    btn.onclick = async () => {
      const url = window.location.origin + window.location.pathname + '#/live';
      const w = window.open(url, '_blank');
      if (!w || w.closed || typeof w.closed === 'undefined') {
        try {
          await navigator.clipboard.writeText(url);
          showToast('URL du live copiée — collez-la dans un nouvel onglet');
        } catch {
          await showConfirm('Ouvrir le live', `Copiez cette URL dans un nouvel onglet :\n\n${url}`, { confirmLabel: 'OK', cancelLabel: 'Fermer' });
        }
      }
    };
  });

  document.querySelectorAll('[data-action="reset-all"]').forEach(btn => {
    btn.onclick = async () => {
      const ok = await showConfirm(
        'Tout réinitialiser',
        'Le minuteur et la rotation en cours vont être effacés. Les noms de groupes et les capitaines sont conservés. Action irréversible.',
        { danger: true, confirmLabel: 'Effacer tout' }
      );
      if (!ok) return;
      state.currentRotation = 0;
      state.phase = 'idle';
      state.timerEnd = null;
      state.timerPaused = false;
      state.timerRemaining = null;
      await saveState();
      render();
      showToast('Événement réinitialisé');
    };
  });

  document.querySelectorAll('[data-action="reset-event"]').forEach(btn => {
    btn.onclick = async () => {
      const ok = await showConfirm(
        "Redémarrer l'événement",
        'Repartir de zéro (rotation 0, en attente). Confirmer ?',
        { confirmLabel: 'Redémarrer' }
      );
      if (!ok) return;
      state.currentRotation = 0;
      state.phase = 'idle';
      state.timerEnd = null;
      state.timerPaused = false;
      state.timerRemaining = null;
      await saveState();
      render();
    };
  });

  // Admin config inputs
  document.querySelectorAll('[data-config="group-name"]').forEach(inp => {
    inp.onblur = async () => {
      const idx = parseInt(inp.dataset.idx, 10);
      const val = inp.value.trim() || `Groupe ${idx + 1}`;
      if (val === state.config.groups[idx].name) return;
      state.config.groups[idx].name = val;
      await saveStatePatch({ config: state.config });
    };
  });
  document.querySelectorAll('[data-config="group-captain"]').forEach(inp => {
    inp.onblur = async () => {
      const idx = parseInt(inp.dataset.idx, 10);
      const val = inp.value.trim();
      if (val === (state.config.groups[idx].captain || '')) return;
      state.config.groups[idx].captain = val;
      await saveStatePatch({ config: state.config });
    };
  });

  // "Réinitialiser" on the groups slide — wipes participant count + all captain names
  document.querySelectorAll('[data-action="reset-groups"]').forEach(btn => {
    btn.onclick = async () => {
      if (typeof showConfirm === 'function') {
        const ok = await showConfirm(
          'Réinitialiser',
          'Le nombre de participantes et tous les prénoms des capitaines vont être effacés. Continuer ?',
          { danger: true, confirmLabel: 'Effacer' }
        );
        if (!ok) return;
      } else if (!confirm('Effacer le nombre de participantes et tous les prénoms des capitaines ?')) {
        return;
      }
      state.participantCount = null;
      state.config.groups.forEach(g => { g.captain = ''; });
      await saveStatePatch({ participantCount: null, config: state.config });
      render();
      if (typeof showToast === 'function') showToast('Groupes réinitialisés');
    };
  });

  // Captain name inputs (save on blur / Enter)
  document.querySelectorAll('[data-captain-idx]').forEach(inp => {
    inp.onblur = async () => {
      const idx = parseInt(inp.dataset.captainIdx, 10);
      const newVal = inp.value.trim();
      if (newVal === (state.config.groups[idx].captain || '')) return;
      state.config.groups[idx].captain = newVal;
      await saveStatePatch({ config: state.config });
      const card = inp.closest('.brief-captain-card');
      if (card) card.classList.toggle('filled', !!newVal);
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur(); };
  });
}

// Keyboard arrows for briefing carousel
if (!window._instantKeyboardAttached) {
  window._instantKeyboardAttached = true;
  document.addEventListener('keydown', (e) => {
    if (getRoute() !== 'screen') return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' && briefingSlide < BRIEFING_SLIDES.length - 1) {
      briefingSlide++; render();
    } else if (e.key === 'ArrowLeft' && briefingSlide > 0) {
      briefingSlide--; render();
    }
  });
}

// ============================================================
// INIT (will be extended in step 9 once all render functions exist)
// ============================================================
(async () => {
  await loadState();
  render();
})();
</script>
