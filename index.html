<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Un instant de vérité</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f5f2ec;
    --bg-soft: #ece8dc;
    --ink: #0e1a33;
    --ink-soft: #2a3a5e;
    --muted: #7a8196;
    --card: #fbf9f4;
    --accent: #14254a;
    --accent-soft: #2c4171;
    --terracotta: #b89333;
    --gold: #d4b566;
    --line: #e0dbcf;
    --danger: #8b2a1e;
    --shadow: 0 1px 2px rgba(14, 26, 51, 0.04), 0 8px 24px rgba(14, 26, 51, 0.06);
    --shadow-lg: 0 1px 2px rgba(14, 26, 51, 0.04), 0 24px 64px rgba(14, 26, 51, 0.12);
    --radius: 18px;
    --radius-sm: 10px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter Tight', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 20% 10%, rgba(20, 37, 74, 0.04) 0%, transparent 40%),
                      radial-gradient(circle at 80% 90%, rgba(184, 147, 51, 0.04) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }
  input, select {
    font-family: inherit;
    color: inherit;
  }

  /* ============ ROOT LAYOUT ============ */
  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ============ HOME PAGE ============ */
  .home-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 60px;
    gap: 48px;
  }
  .home-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }
  .home-logo {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: var(--accent);
    color: var(--card);
    font-family: var(--font-display);
    font-size: 36px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-lg);
  }
  .home-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .home-subtitle {
    font-size: 15px;
    color: var(--muted);
    font-weight: 400;
  }
  .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 680px;
  }
  .home-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 28px 20px 24px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    text-align: center;
  }
  .home-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent-soft);
  }
  .home-card:active { transform: scale(0.97); }
  .home-card-icon {
    font-size: 28px;
    line-height: 1;
  }
  .home-card-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .home-card-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* ============ ROLE SWITCHER (subtle, top-right) ============ */
  .role-bar {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    box-shadow: var(--shadow);
  }
  .role-bar button {
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    border-radius: 999px;
    transition: all 0.2s ease;
  }
  .role-bar button:hover { color: var(--ink); }
  .role-bar button.active {
    background: var(--accent);
    color: var(--card);
  }

  /* ============ SCREEN: LANDING ============ */
  .landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }
  .landing-ornament {
    width: 80px;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 32px;
    position: relative;
  }
  .landing-ornament::before, .landing-ornament::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    transform: translateY(-50%);
  }
  .landing-ornament::before { left: -16px; }
  .landing-ornament::after { right: -16px; }
  .landing-kicker {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .landing h1 {
    font-family: var(--font-display);
    font-size: clamp(48px, 10vw, 96px);
    font-weight: 400;
    font-variation-settings: 'opsz' 144;
    letter-spacing: -0.03em;
    line-height: 0.95;
    color: var(--accent);
    margin-bottom: 20px;
  }
  .landing h1 em {
    font-style: italic;
    color: var(--terracotta);
    font-variation-settings: 'opsz' 144;
  }
  .landing-sub {
    font-size: 16px;
    color: var(--ink-soft);
    max-width: 520px;
    margin: 0 auto 48px;
    line-height: 1.6;
  }
  .role-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    max-width: 800px;
    width: 100%;
  }
  .role-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 24px;
    text-align: left;
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
  }
  .role-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent);
  }
  .role-card-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 50%;
    font-style: italic;
  }
  .role-card-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .role-card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ============ PROJECTION SCREEN ============ */
  .screen {
    min-height: 100vh;
    padding: 48px 64px;
    display: flex;
    flex-direction: column;
  }
  .screen-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
  }
  .screen-title-block .kicker {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .screen-title-block h1 {
    font-family: var(--font-display);
    font-size: 72px;
    font-weight: 400;
    font-variation-settings: 'opsz' 144;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--accent);
  }
  .screen-title-block h1 em {
    font-style: italic;
    color: var(--terracotta);
  }
  .timer-block {
    text-align: right;
  }
  .timer-phase {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .timer-phase.active-epreuve { color: var(--accent); }
  .timer-phase.active-transition { color: var(--terracotta); }
  .timer-display {
    font-family: var(--font-display);
    font-size: 88px;
    font-weight: 400;
    font-variation-settings: 'opsz' 144, 'wght' 400;
    line-height: 1;
    letter-spacing: -0.04em;
    font-feature-settings: 'tnum' 1;
    color: var(--ink);
  }
  .timer-display.paused { color: var(--muted); }
  @keyframes timerAlert {
    0%, 100% { color: var(--danger); opacity: 1; }
    50%       { color: var(--danger); opacity: 0.25; }
  }
  .timer-display.alert { animation: timerAlert 1s ease-in-out infinite; }

  .rotation-indicator {
    display: flex;
    gap: 8px;
    margin: 24px 0 40px;
    align-items: center;
  }
  .rotation-dot {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 500;
    color: var(--muted);
    transition: all 0.3s ease;
  }
  .rotation-dot.done {
    background: var(--accent-soft);
    border-color: var(--accent-soft);
    color: var(--card);
  }
  .rotation-dot.current {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--card);
    transform: scale(1.15);
    box-shadow: 0 0 0 4px rgba(20, 37, 74, 0.15);
  }
  .rotation-line {
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .screen-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 32px;
    flex: 1;
  }
  .section-label {
    font-family: var(--font-display);
    font-size: 14px;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 16px;
    font-weight: 400;
  }

  .ateliers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .atelier-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .atelier-card.highlight {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--card);
  }
  .atelier-card.highlight .atelier-letter { color: var(--gold); }
  .atelier-card.highlight .atelier-teams-label { color: rgba(251, 249, 244, 0.6); }
  .atelier-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
  }
  .atelier-letter {
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 400;
    font-variation-settings: 'opsz' 144;
    font-style: italic;
    color: var(--terracotta);
    line-height: 0.9;
  }
  .atelier-name {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .atelier-teams-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .atelier-teams {
    font-size: 14px;
    font-weight: 500;
  }
  .atelier-teams-empty {
    font-size: 14px;
    font-style: italic;
    opacity: 0.5;
  }

  .leaderboard {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
  }
  .leaderboard-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .leaderboard-row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .leaderboard-row:last-child { border-bottom: none; }
  .leaderboard-rank {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 18px;
    color: var(--muted);
    font-weight: 500;
  }
  .leaderboard-row.top-1 .leaderboard-rank { color: var(--gold); font-size: 22px; }
  .leaderboard-row.top-2 .leaderboard-rank { color: var(--terracotta); }
  .leaderboard-row.top-3 .leaderboard-rank { color: var(--accent-soft); }
  .leaderboard-name {
    font-size: 15px;
    font-weight: 500;
  }
  .leaderboard-score {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-feature-settings: 'tnum' 1;
  }
  .leaderboard-list.blurred { filter: blur(8px); user-select: none; pointer-events: none; transition: filter 0.6s ease; }
  .leaderboard-list.blurred:hover { filter: blur(8px); }
  .leaderboard-reveal-hint { text-align:center; font-size:12px; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); margin-top:10px; }
  .leaderboard-score-max {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  /* ============ PODIUM OVERLAY ============ */
  .section-label-btn {
    background: none; border: none; padding: 0;
    font: inherit; color: inherit; letter-spacing: inherit;
    text-transform: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .section-label-btn::after { content: '🏆'; font-size: 14px; opacity: 0.5; transition: opacity 0.2s; }
  .section-label-btn:hover::after { opacity: 1; }

  .podium-overlay {
    position: fixed; inset: 0;
    background: rgba(26,42,31,0.88);
    z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #podium-confetti {
    position: fixed; inset: 0; pointer-events: none; z-index: 199;
  }
  .podium-content {
    background: var(--card); border-radius: var(--radius);
    padding: 40px 32px 32px; max-width: 500px; width: 100%;
    text-align: center; position: relative; z-index: 201;
    animation: podiumEnter 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes podiumEnter {
    from { transform: scale(0.4) translateY(60px); opacity: 0; }
    to   { transform: scale(1) translateY(0);      opacity: 1; }
  }
  .podium-congrats {
    font-family: var(--font-display); font-size: 38px; font-weight: 700;
    color: var(--accent); line-height: 1; margin-bottom: 4px;
  }
  .podium-sub {
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 36px;
  }
  .podium-stage {
    display: flex; align-items: flex-end; justify-content: center; gap: 6px; margin-bottom: 32px;
  }
  .podium-step { display: flex; flex-direction: column; align-items: center; width: 140px; }
  .podium-medal { font-size: 26px; margin-bottom: 4px; }
  .podium-name {
    font-family: var(--font-display); font-size: 14px; font-weight: 600;
    color: var(--ink); margin-bottom: 4px; text-align: center; line-height: 1.2;
  }
  .podium-pts { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .podium-bar {
    width: 100%; border-radius: 8px 8px 0 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 32px; font-weight: 700; color: white;
  }
  .podium-step.p1 .podium-bar { height: 130px; background: var(--gold); }
  .podium-step.p2 .podium-bar { height: 90px;  background: var(--ink-soft); }
  .podium-step.p3 .podium-bar { height: 65px;  background: var(--terracotta); }
  .podium-step.p1 { animation: podiumRise 0.5s 0.3s cubic-bezier(0.34,1.4,0.64,1) both; }
  .podium-step.p2 { animation: podiumRise 0.5s 0.5s cubic-bezier(0.34,1.4,0.64,1) both; }
  .podium-step.p3 { animation: podiumRise 0.5s 0.7s cubic-bezier(0.34,1.4,0.64,1) both; }
  @keyframes podiumRise { from { transform: translateY(40px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  .podium-close {
    background: var(--accent); color: white; border: none; border-radius: var(--radius-sm);
    padding: 12px 36px; font-family: var(--font-body); font-size: 14px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.04em;
  }
  .podium-close:hover { background: var(--ink); }

  /* ============ QR CODE SECTION (on screen) ============ */
  .screen-footer {
    margin-top: 32px;
    padding: 20px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .screen-footer-text {
    flex: 1;
  }
  .screen-footer-text .kicker {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .screen-footer-text .url {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 500;
    color: var(--accent);
    word-break: break-all;
  }
  .qr-box {
    width: 100px;
    height: 100px;
    background: #fff;
    border-radius: 8px;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .qr-box img { width: 100%; height: 100%; }

  /* ============ MOBILE VIEWS (capitaine, responsable) ============ */
  .mobile-view {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 20px 120px;
    min-height: 100vh;
  }
  .mobile-header {
    margin-bottom: 32px;
    padding-top: 20px;
  }
  .mobile-header .kicker {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .mobile-header h1 {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 400;
    font-variation-settings: 'opsz' 144;
    letter-spacing: -0.02em;
    line-height: 1.05;
    color: var(--accent);
  }
  .mobile-header h1 em { font-style: italic; color: var(--terracotta); }

  /* Login card */
  .login-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: var(--shadow);
  }
  .login-card .form-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: block;
    font-weight: 500;
  }
  .login-card select,
  .login-card input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    font-size: 16px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  .login-card select:focus,
  .login-card input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .login-card .submit-btn {
    width: 100%;
    background: var(--accent);
    color: var(--card);
    padding: 16px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: background 0.2s;
  }
  .login-card .submit-btn:hover { background: var(--ink); }
  .login-card .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg {
    color: var(--danger);
    font-size: 13px;
    margin-top: -12px;
    margin-bottom: 16px;
    text-align: center;
  }

  /* Capitaine dashboard */
  .cap-status {
    background: var(--accent);
    color: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .cap-status::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    background: rgba(184, 147, 51, 0.15);
    border-radius: 50%;
  }
  .cap-status .kicker {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
    font-weight: 500;
    position: relative;
  }
  .cap-status-letter {
    font-family: var(--font-display);
    font-size: 96px;
    font-variation-settings: 'opsz' 144;
    font-style: italic;
    color: var(--gold);
    line-height: 0.85;
    position: relative;
  }

    font-size: 13px;
    margin-bottom: 6px;
  }
  .admin-config-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .admin-config-row .prefix {
    font-family: var(--font-display);
    font-size: 14px;
    color: var(--terracotta);
    width: 20px;
    font-style: italic;
  }

  /* ============ CONFIRM MODAL ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(14, 26, 51, 0.5);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease-out;
  }
  .modal-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 440px;
    width: 100%;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--line);
  }
  .modal-card h3 {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .modal-card p {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .modal-btn {
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .modal-btn.cancel {
    background: var(--bg-soft);
    color: var(--ink-soft);
  }
  .modal-btn.cancel:hover { background: var(--line); }
  .modal-btn.confirm {
    background: var(--accent);
    color: var(--card);
  }
  .modal-btn.confirm:hover { background: var(--ink); }
  .modal-btn.confirm.danger { background: var(--danger); }
  .modal-btn.confirm.danger:hover { background: #8e2816; }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--card);
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    z-index: 1001;
    animation: toastIn 0.3s ease-out;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* ============ BRIEFING CAROUSEL ============ */
  .brief {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    padding: 40px 48px 80px;
  }
  .brief-nav {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .brief-nav-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.15s;
  }
  .brief-nav-btn:hover:not(:disabled) {
    background: var(--accent);
    color: var(--card);
  }
  .brief-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .brief-nav-dots {
    display: flex;
    gap: 6px;
  }
  .brief-nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line);
    transition: all 0.2s;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .brief-nav-dot.active {
    background: var(--accent);
    width: 24px;
    border-radius: 999px;
  }
  .brief-nav-live {
    background: var(--accent);
    color: var(--card);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.2s;
    margin-left: 8px;
  }
  .brief-nav-live:hover { background: var(--ink); }

  .brief-slide {
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: slideFade 0.4s ease-out;
  }
  @keyframes slideFade {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .brief-kicker {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .brief-title {
    font-family: var(--font-display);
    font-size: clamp(56px, 8vw, 96px);
    font-weight: 400;
    font-variation-settings: 'opsz' 144;
    letter-spacing: -0.03em;
    line-height: 0.95;
    color: var(--accent);
    margin-bottom: 24px;
  }
  .brief-title em {
    font-style: italic;
    color: var(--terracotta);
  }
  .brief-lead {
    font-family: var(--font-display);
    font-size: clamp(20px, 2.5vw, 28px);
    font-weight: 400;
    font-style: italic;
    color: var(--ink-soft);
    line-height: 1.4;
    max-width: 880px;
    margin-bottom: 40px;
  }

  /* Slide 1: Bienvenue (centered, no QR) */
  .brief-welcome-centered {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .brief-welcome-title {
    font-family: var(--font-display);
    font-size: clamp(72px, 12vw, 140px);
    font-weight: 400;
    font-variation-settings: 'opsz' 144;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 32px;
  }
  .brief-welcome-title em {
    font-style: italic;
    color: var(--terracotta);
  }
  .brief-welcome-sub {
    font-family: var(--font-display);
    font-size: clamp(20px, 2.8vw, 30px);
    font-weight: 400;
    font-style: italic;
    color: var(--ink-soft);
    max-width: 720px;
    line-height: 1.4;
  }

  /* Slide 1: Bienvenue */
  .brief-welcome {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 48px;
    align-items: center;
    flex: 1;
  }
  .brief-welcome-right {
    text-align: center;
    padding: 32px;
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }
  .brief-qr {
    width: 260px;
    height: 260px;
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    margin: 0 auto 20px;
  }
  .brief-qr img { width: 100%; height: 100%; }
  .brief-qr-label {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    font-style: italic;
    margin-bottom: 6px;
    color: var(--accent);
  }
  .brief-qr-url {
    font-size: 13px;
    color: var(--muted);
    word-break: break-all;
  }

  /* Slide 2: Concept — stat numbers (3 stats version) */
  .brief-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    margin-top: 32px;
  }
  .brief-stats.brief-stats-3 {
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    max-width: 900px;
  }
  .brief-stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 32px;
    text-align: center;
  }
  .brief-stat-num {
    font-family: var(--font-display);
    font-size: clamp(72px, 10vw, 120px);
    font-variation-settings: 'opsz' 144;
    font-weight: 400;
    line-height: 0.9;
    color: var(--accent);
    letter-spacing: -0.04em;
  }
  .brief-stat-num em {
    font-style: italic;
    color: var(--terracotta);
  }
  .brief-stat-label {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 12px;
    font-weight: 500;
    line-height: 1.4;
  }

  /* Slide 4: Atelier fonctionnement */
  .brief-atelier-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 24px;
  }
  .brief-atelier-step {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 24px;
    position: relative;
  }
  .brief-atelier-step-num {
    font-family: var(--font-display);
    font-size: 56px;
    font-style: italic;
    color: var(--terracotta);
    line-height: 0.9;
    margin-bottom: 12px;
    font-variation-settings: 'opsz' 144;
  }
  .brief-atelier-step-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .brief-atelier-step-desc {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .brief-atelier-footer {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 24px;
    background: var(--accent);
    color: var(--card);
    padding: 24px 28px;
    border-radius: var(--radius);
  }
  .brief-atelier-footer-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .brief-atelier-footer-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(251, 249, 244, 0.7);
    font-weight: 500;
  }
  .brief-atelier-footer-value {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 500;
    color: var(--gold);
    line-height: 1;
    font-variation-settings: 'opsz' 144;
  }
  .brief-atelier-footer-value em {
    font-style: italic;
  }

  /* Slide 5: Teams calculator */
  .brief-teams-calc {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 32px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px;
    margin-top: 24px;
  }
  .brief-teams-calc-left {
    text-align: left;
  }
  .brief-teams-calc-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 500;
  }
  .brief-teams-calc-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    font-family: var(--font-display);
    font-size: clamp(48px, 7vw, 80px);
    font-weight: 400;
    color: var(--accent);
    padding: 8px 0;
    font-variation-settings: 'opsz' 144;
    font-feature-settings: 'tnum' 1;
    transition: border-color 0.2s;
  }
  .brief-teams-calc-input:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  .brief-teams-calc-input::placeholder {
    color: var(--line);
    font-style: italic;
  }
  .brief-teams-calc-hint {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    margin-top: 8px;
  }
  .brief-teams-calc-arrow {
    font-family: var(--font-display);
    font-size: 48px;
    color: var(--terracotta);
    font-style: italic;
  }
  .brief-teams-calc-right {
    text-align: left;
  }
  .brief-teams-calc-empty {
    color: var(--muted);
  }
  .brief-teams-calc-empty-label {
    font-family: var(--font-display);
    font-size: 24px;
    font-style: italic;
    margin-bottom: 6px;
  }
  .brief-teams-calc-empty-hint {
    font-size: 13px;
  }
  .brief-teams-calc-result-num {
    font-family: var(--font-display);
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
    font-variation-settings: 'opsz' 144;
  }
  .brief-teams-calc-result-eq {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--muted);
    font-style: italic;
    margin: 6px 0 12px;
  }
  .brief-teams-calc-result-text {
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .brief-teams-calc-result-text strong {
    font-family: var(--font-display);
    font-weight: 500;
    color: var(--accent);
    font-size: 18px;
  }
  .brief-teams-hint {
    margin-top: 24px;
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    line-height: 1.6;
    text-align: center;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Captains grid on teams slide */
  .brief-captains-section {
    margin-top: 32px;
  }
  .brief-captains-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    gap: 24px;
    flex-wrap: wrap;
  }
  .brief-captains-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    font-style: italic;
    color: var(--terracotta);
  }
  .brief-captains-hint {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }
  .brief-captains-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .brief-captain-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: all 0.2s;
  }
  .brief-captain-card.filled {
    background: var(--accent);
    border-color: var(--accent);
  }
  .brief-captain-card.filled .brief-captain-num { color: var(--gold); }
  .brief-captain-card.filled .brief-captain-input {
    color: var(--card);
    border-bottom-color: rgba(184, 147, 51, 0.4);
  }
  .brief-captain-card.filled .brief-captain-input::placeholder {
    color: rgba(251, 249, 244, 0.5);
  }
  .brief-captain-num {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 500;
    font-style: italic;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .brief-captain-num::before { content: 'Groupe '; }
  .brief-captain-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 4px 0;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
    width: 100%;
    transition: border-color 0.2s;
  }
  .brief-captain-input:focus {
    outline: none;
    border-bottom-color: var(--terracotta);
  }
  .brief-captain-input::placeholder {
    font-style: italic;
    color: var(--muted);
    font-weight: 400;
    font-size: 14px;
  }

  /* Slide 6: Webapp access */
  .brief-webapp {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 48px;
    align-items: center;
    margin-top: 24px;
  }
  .brief-webapp-qr-block {
    text-align: center;
  }
  .brief-webapp-qr {
    width: 300px;
    height: 300px;
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .brief-webapp-qr img { width: 100%; height: 100%; }
  .brief-webapp-qr-label {
    font-size: 13px;
    color: var(--muted);
    word-break: break-all;
    max-width: 300px;
    margin: 0 auto;
  }
  .brief-webapp-roles {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .brief-webapp-role {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 20px;
    align-items: center;
  }
  .brief-webapp-role-letter {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 28px;
    font-style: italic;
    font-variation-settings: 'opsz' 144;
  }
  .brief-webapp-role-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .brief-webapp-role-desc {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  /* Slide 3: Les 4 ateliers (2x2) */
  .brief-epreuves {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 24px;
    max-width: 1000px;
  }
  .brief-epreuve {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .brief-epreuve:hover {
    box-shadow: var(--shadow);
    transform: translateY(-2px);
    transition: all 0.2s;
  }
  .brief-epreuve-letter {
    font-family: var(--font-display);
    font-size: 72px;
    font-variation-settings: 'opsz' 144;
    font-style: italic;
    color: var(--terracotta);
    line-height: 0.85;
  }
  .brief-epreuve-name {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .brief-epreuve-desc {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    flex: 1;
  }
  .brief-epreuve-pts {
    font-family: var(--font-display);
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .brief-epreuve-resp {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }

  /* Slide 4: Points system */
  .brief-points-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    margin-top: 24px;
  }
  .brief-points-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
  }
  .brief-points-card h3 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }
  .brief-points-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .brief-points-row:last-child { border-bottom: none; }
  .brief-points-label {
    font-size: 15px;
    color: var(--ink-soft);
  }
  .brief-points-value {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 500;
    color: var(--accent);
  }
  .brief-points-value em {
    font-style: italic;
    color: var(--terracotta);
  }
  .brief-points-note {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .brief-points-total {
    background: var(--accent);
    color: var(--card);
    padding: 24px;
    border-radius: var(--radius);
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .brief-points-total-label {
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .brief-points-total-value {
    font-family: var(--font-display);
    font-size: 56px;
    font-variation-settings: 'opsz' 144;
    font-weight: 400;
    color: var(--gold);
  }

  /* Slide 5: Organisation */
  .brief-org {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    margin-top: 32px;
  }
  .brief-org-col {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
  }
  .brief-org-col h3 {
    font-family: var(--font-display);
    font-size: 24px;
    font-style: italic;
    font-weight: 400;
    color: var(--terracotta);
    margin-bottom: 20px;
  }
  .brief-org-item {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 16px;
    margin-bottom: 20px;
    align-items: flex-start;
  }
  .brief-org-item:last-child { margin-bottom: 0; }
  .brief-org-num {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
    font-feature-settings: 'tnum' 1;
  }
  .brief-org-item-title {
    font-family: var(--font-display);

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app" id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-style:italic;color:var(--muted);font-size:18px">Chargement…</div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const ATELIERS = [
  {
    key: 1,
    name: "L'intelligence du cœur",
    desc: "Une vidéo qui montre que le cœur a son propre cerveau.",
    responsible: "Ansa Soumia",
    location: "Grande salle du haut"
  },
  {
    key: 2,
    name: "La boîte à questions",
    desc: "Poser les vraies questions qui nous bloquent pour avancer.",
    responsible: "Ansa Assya",
    location: "Réfectoire"
  },
  {
    key: 3,
    name: "Story telling",
    desc: "L'histoire de deux maîtresses qui ont fait un choix qui a donné un sens à leur vie.",
    responsible: "Rayyan et Fatima",
    location: "Terrasse piscine"
  },
  {
    key: 4,
    name: "Introspection",
    desc: "Chaque fille tire une carte et répond à une question d'introspection.",
    responsible: "Ansa Safa",
    location: "Terrasse cuisine"
  },
];
const N_GROUPS = 4;
const N_ROTATIONS = 4;
const EPREUVE_DURATION = 35 * 60;       // 35 min
const TRANSITION_DURATION = 5 * 60;     // 5 min
const ADMIN_CODE = 'ADMIN2026';

// Rotation schedule: each group visits each atelier exactly once.
// SCHEDULE[rotationIdx][atelierIdx] = groupId
// Cyclic shift: group at atelier a during rotation r = (a - r) mod N_GROUPS
function buildSchedule() {
  const sched = [];
  for (let r = 0; r < N_ROTATIONS; r++) {
    const row = [];
    for (let a = 0; a < ATELIERS.length; a++) {
      row.push((a - r + N_GROUPS) % N_GROUPS);
    }
    sched.push(row);
  }
  return sched;
}
const SCHEDULE = buildSchedule();

// ============================================================
// STATE (persisted via Supabase or localStorage)
// ============================================================
const DEFAULT_CONFIG = {
  groups: Array.from({length: N_GROUPS}, (_, i) => ({
    id: i,
    name: `Groupe ${i + 1}`,
    captain: ''
  }))
};

function groupDisplayName(g) {
  if (!g) return '';
  if (g.captain && g.captain.trim()) return `${g.name} · ${g.captain.trim()}`;
  return g.name;
}

function groupShortName(g) {
  if (!g) return '';
  if (g.captain && g.captain.trim()) return g.captain.trim();
  return g.name.replace('Groupe ', 'Gr. ');
}

let state = {
  currentRotation: 0,      // 0 = not started, 1..N_ROTATIONS = active, N_ROTATIONS+1 = finished
  phase: 'idle',           // 'idle' | 'epreuve' | 'transition'
  timerEnd: null,          // epoch ms when current phase ends
  timerPaused: false,
  timerRemaining: null,    // used when paused
  participantCount: null,
  config: DEFAULT_CONFIG
};

// ============================================================
// STORAGE — Supabase (primary) + localStorage (fallback)
// ============================================================
const STORAGE_KEY = 'instant:state';
let storageMode = 'local';  // 'supabase' | 'local'

const _supabase = (window.INSTANT_SUPABASE_URL && window.INSTANT_SUPABASE_ANON_KEY)
  ? window.supabase.createClient(window.INSTANT_SUPABASE_URL, window.INSTANT_SUPABASE_ANON_KEY)
  : null;

async function loadState() {
  if (_supabase) {
    try {
      const { data, error } = await _supabase
        .from('event_state')
        .select('data')
        .eq('id', 1)
        .maybeSingle();
      if (!error && data && data.data) {
        state = { ...state, ...data.data };
        if (!state.config) state.config = DEFAULT_CONFIG;
      }
      storageMode = 'supabase';
      return;
    } catch(e) {
      console.warn('Supabase unavailable, falling back to localStorage', e);
    }
  }
  try {
    const v = localStorage.getItem(STORAGE_KEY);
    if (v) {
      const parsed = JSON.parse(v);
      state = { ...state, ...parsed };
      if (!state.config) state.config = DEFAULT_CONFIG;
    }
  } catch(e) {}
  storageMode = 'local';
}

// Full-state overwrite — used only for intentional resets.
async function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  if (_supabase) {
    const { error } = await _supabase
      .from('event_state')
      .upsert({ id: 1, data: state, updated_at: new Date().toISOString() });
    storageMode = error ? 'local' : 'supabase';
    if (error) console.error('[saveState] upsert error:', error.message);
  }
}

// Targeted patch — updates only the provided top-level keys (timer, config, …).
async function saveStatePatch(patch) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  if (!_supabase) return;
  const { error } = await _supabase.rpc('save_state_patch', { p_patch: patch });
  if (!error) { storageMode = 'supabase'; return; }
  await saveState();  // fallback
}

// Real-time sync: Supabase Realtime when configured, localStorage polling otherwise
if (_supabase) {
  _supabase
    .channel('instant-state')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'event_state' }, (payload) => {
      if (!payload.new || !payload.new.data) return;
      state = { ...state, ...payload.new.data };
      if (!state.config) state.config = DEFAULT_CONFIG;
      const active = document.activeElement;
      const isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
      if (!isTyping && typeof render === 'function') render();
    })
    .subscribe();
} else {
  let lastStateHash = '';
  setInterval(() => {
    try {
      const v = localStorage.getItem(STORAGE_KEY);
      if (v && v !== lastStateHash) {
        lastStateHash = v;
        const parsed = JSON.parse(v);
        state = { ...state, ...parsed };
        if (!state.config) state.config = DEFAULT_CONFIG;
        const active = document.activeElement;
        const isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
        if (!isTyping && typeof render === 'function') render();
      }
    } catch(e) {}
  }, 3000);
}

// ============================================================
// ROUTING (hash-based: #/screen, #/live, #/admin)
// ============================================================
function getRoute() {
  const h = window.location.hash.slice(1) || '/';
  if (h === '/' || h === '') return 'home';
  if (h.startsWith('/screen')) return 'screen';
  if (h.startsWith('/live'))   return 'live';
  if (h.startsWith('/admin'))  return 'admin';
  return 'home';
}
window.addEventListener('hashchange', () => { if (typeof render === 'function') render(); });

// Local preferences on this device.
//   - myGroup (persistent): which group is the user following? (localStorage)
//   - admin session (ephemeral): is the admin unlocked on this device? (sessionStorage)
const MY_GROUP_KEY      = 'instant:myGroup';
const SESSION_KEY_ADMIN = 'instant:session:admin';

function getMyGroup() {
  try {
    const v = localStorage.getItem(MY_GROUP_KEY);
    if (v === null) return null;
    const n = parseInt(v, 10);
    return (n >= 0 && n < N_GROUPS) ? n : null;
  } catch { return null; }
}
function setMyGroup(groupId) {
  try {
    if (groupId === null) localStorage.removeItem(MY_GROUP_KEY);
    else localStorage.setItem(MY_GROUP_KEY, String(groupId));
  } catch {}
}

function getSessionAdmin() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY_ADMIN) || 'null'); } catch { return null; } }
function setSessionAdmin(v){ try { sessionStorage.setItem(SESSION_KEY_ADMIN, JSON.stringify(v)); } catch {} }

// Fallback to in-memory if sessionStorage is blocked (sandboxed iframes etc.)
let _sessAdmin = null;
try { sessionStorage.getItem('test'); } catch {
  window.getSessionAdmin = () => _sessAdmin;
  window.setSessionAdmin = (v) => { _sessAdmin = v; };
}

// ============================================================
// TIMER LOGIC
// ============================================================
function getTimerRemaining() {
  if (state.phase === 'idle') return EPREUVE_DURATION;
  if (state.timerPaused) return state.timerRemaining || 0;
  if (!state.timerEnd) return 0;
  return Math.max(0, Math.floor((state.timerEnd - Date.now()) / 1000));
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

// ============================================================
// AUDIO ALERT (short beep during last minute, triple chime at phase end)
// ============================================================
let _audioCtx = null;

// Unlock AudioContext on first user interaction (browser autoplay policy)
document.addEventListener('click',      () => { if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); else if (_audioCtx.state === 'suspended') _audioCtx.resume(); }, { once: false });
document.addEventListener('touchstart', () => { if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); else if (_audioCtx.state === 'suspended') _audioCtx.resume(); }, { once: false });

function playBeep() {
  try {
    if (!_audioCtx) return;
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    const osc  = _audioCtx.createOscillator();
    const gain = _audioCtx.createGain();
    osc.connect(gain);
    gain.connect(_audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, _audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + 0.2);
    osc.start(_audioCtx.currentTime);
    osc.stop(_audioCtx.currentTime + 0.2);
  } catch(e) {}
}

function playEndAlarm() {
  try {
    if (!_audioCtx) return;
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    const t = _audioCtx.currentTime;
    for (let ring = 0; ring < 3; ring++) {
      const s = t + ring * 0.7;
      const osc = _audioCtx.createOscillator();
      const g   = _audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 920;
      g.gain.setValueAtTime(0.3, s);
      g.gain.exponentialRampToValueAtTime(0.001, s + 0.5);
      osc.connect(g); g.connect(_audioCtx.destination);
      osc.start(s); osc.stop(s + 0.55);
    }
  } catch(e) {}
}

// ============================================================
// MAIN TICK — every second
//   - On the admin device only, auto-advance the phase when the timer expires
//     (writing timerEnd from every connected device would cause jumps).
//   - On every route that shows a timer, refresh the display.
// ============================================================
setInterval(() => {
  const route = getRoute();

  if (route === 'admin' &&
      state.phase !== 'idle' && !state.timerPaused &&
      state.timerEnd && Date.now() >= state.timerEnd) {
    if (state.phase === 'epreuve') {
      playEndAlarm();
      state.phase = 'transition';
      state.timerEnd = Date.now() + TRANSITION_DURATION * 1000;
      saveStatePatch({ phase: state.phase, timerEnd: state.timerEnd, timerPaused: false, currentRotation: state.currentRotation });
    } else if (state.phase === 'transition') {
      if (state.currentRotation < N_ROTATIONS) {
        state.currentRotation += 1;
        state.phase = 'epreuve';
        state.timerEnd = Date.now() + EPREUVE_DURATION * 1000;
      } else {
        state.currentRotation = N_ROTATIONS + 1;
        state.phase = 'idle';
        state.timerEnd = null;
      }
      saveStatePatch({ phase: state.phase, timerEnd: state.timerEnd, timerPaused: false, timerRemaining: null, currentRotation: state.currentRotation });
    }
    if (typeof render === 'function') render();
  }

  if (['screen', 'live', 'admin'].includes(route)) {
    updateTimerDisplays();
  }
}, 1000);

// Also play the end-of-phase alarm on non-admin devices when Realtime pushes
// a phase change from 'epreuve' to 'transition'.
(function hookRealtimeAlarm() {
  if (!_supabase) return;
  let prevPhase = state.phase;
  _supabase
    .channel('instant-alarm')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'event_state' }, (payload) => {
      const newPhase = payload?.new?.data?.phase;
      if (prevPhase === 'epreuve' && newPhase === 'transition' && getRoute() !== 'admin') {
        playEndAlarm();
      }
      prevPhase = newPhase;
    })
    .subscribe();
})();

function updateTimerDisplays() {
  const remaining = getTimerRemaining();
  const isAlert = state.phase === 'epreuve' && !state.timerPaused && remaining <= 60 && remaining > 0;
  document.querySelectorAll('[data-timer]').forEach(el => {
    el.textContent = formatTime(remaining);
    el.classList.toggle('alert', isAlert);
    el.classList.toggle('paused', !!state.timerPaused);
  });
  if (isAlert) playBeep();
}

// ============================================================
// SCHEDULE HELPERS
// ============================================================
// Returns: { atelierKey: groupId } for the given rotation number (1-indexed). Empty if out of range.
function getAssignmentsForRotation(rotationNum) {
  if (rotationNum < 1 || rotationNum > N_ROTATIONS) return {};
  const row = SCHEDULE[rotationNum - 1];
  const result = {};
  ATELIERS.forEach((a, i) => { result[a.key] = row[i]; });
  return result;
}
function getCurrentAssignments() { return getAssignmentsForRotation(state.currentRotation); }

// Returns: [groupId, groupId, ...] — N_ROTATIONS entries, one per rotation, for the given atelier.
function getAtelierScheduleForAllRotations(atelierKey) {
  const atelierIdx = ATELIERS.findIndex(a => a.key === atelierKey);
  if (atelierIdx === -1) return [];
  const out = [];
  for (let r = 0; r < N_ROTATIONS; r++) out.push(SCHEDULE[r][atelierIdx]);
  return out;
}

// Returns the atelier object where the given group will be during the given rotation (1-indexed).
function getGroupAtelierForRotation(groupId, rotationNum) {
  if (rotationNum < 1 || rotationNum > N_ROTATIONS) return null;
  const row = SCHEDULE[rotationNum - 1];
  for (let i = 0; i < ATELIERS.length; i++) {
    if (row[i] === groupId) return ATELIERS[i];
  }
  return null;
}

// ============================================================
// RENDER — router + home + role bar + projection (briefing slides)
// ============================================================
const root = document.getElementById('app');

function render() {
  const route = getRoute();
  let content = '';
  if (route === 'home')        content = renderHome();
  else if (route === 'screen') content = renderBriefing();
  else if (route === 'live')   content = typeof renderLive  === 'function' ? renderLive()  : '';
  else if (route === 'admin')  content = typeof renderAdmin === 'function' ? renderAdmin() : '';

  root.innerHTML = (route === 'home' ? '' : renderRoleBar(route)) + content;
  if (typeof attachEventHandlers === 'function') attachEventHandlers(route);
}

function renderHome() {
  const secondary = [
    { hash: '#/screen', label: 'Projection', desc: "Écran d'accueil & briefing" },
    { hash: '#/admin',  label: 'Admin',      desc: "Piloter le chrono" },
  ];
  return `
    <div class="home-page fade-in">
      <div class="home-header">
        <div class="home-logo" style="font-style:italic">v</div>
        <h1 class="home-title">Un instant de vérité</h1>
        <p class="home-subtitle">Suivez votre parcours en direct</p>
      </div>

      <button
        onclick="location.hash='#/live'"
        style="font-family:var(--font-display);font-size:clamp(28px,4.5vw,44px);font-style:italic;
               background:var(--accent);color:var(--card);border:none;border-radius:24px;
               padding:32px 48px 28px;cursor:pointer;box-shadow:var(--shadow-lg);
               transition:transform 0.2s, box-shadow 0.2s;
               display:flex;flex-direction:column;gap:6px;align-items:center;
               min-width:280px;letter-spacing:-0.01em"
        onmouseover="this.style.transform='translateY(-3px)'"
        onmouseout="this.style.transform='translateY(0)'">
        Je suis où&nbsp;?
        <span style="font-family:var(--font-body);font-size:11px;letter-spacing:0.3em;
                     text-transform:uppercase;color:var(--terracotta);font-style:normal;font-weight:500">
          Suivre en direct
        </span>
      </button>

      <div class="home-grid" style="grid-template-columns:1fr 1fr;max-width:480px;justify-items:center">
        ${secondary.map(r => `
          <button class="home-card" onclick="location.hash='${r.hash}'">
            <span class="home-card-label">${r.label}</span>
            <span class="home-card-desc">${r.desc}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderRoleBar(route) {
  const roles = [
    { k: 'home',   label: 'Accueil',    hash: '#/' },
    { k: 'live',   label: 'Live',       hash: '#/live' },
    { k: 'screen', label: 'Projection', hash: '#/screen' },
    { k: 'admin',  label: 'Admin',      hash: '#/admin' },
  ];
  return `
    <div class="role-bar">
      ${roles.map(r => `
        <button class="${route === r.k ? 'active' : ''}" onclick="location.hash='${r.hash}'">
          ${r.label}
        </button>
      `).join('')}
    </div>
  `;
}

// ============================================================
// PROJECTION — briefing carousel (welcome → go)
// ============================================================
function renderParticipantsCalcResult(count) {
  if (!count || count < N_GROUPS) {
    return `
      <div class="brief-teams-calc-empty">
        <div class="brief-teams-calc-empty-label">En attente</div>
        <div class="brief-teams-calc-empty-hint">Saisissez le nombre pour voir la répartition</div>
      </div>
    `;
  }
  const perGroup   = Math.floor(count / N_GROUPS);
  const remainder  = count % N_GROUPS;
  let repartition;
  if (remainder === 0) {
    repartition = `<strong>${perGroup}</strong> participantes par groupe`;
  } else {
    repartition = `${remainder} groupe${remainder > 1 ? 's' : ''} de <strong>${perGroup + 1}</strong>, ${N_GROUPS - remainder} groupe${(N_GROUPS - remainder) > 1 ? 's' : ''} de <strong>${perGroup}</strong>`;
  }
  return `
    <div class="brief-teams-calc-result-num">${count}</div>
    <div class="brief-teams-calc-result-eq">÷ ${N_GROUPS} groupes</div>
    <div class="brief-teams-calc-result-text">${repartition}</div>
  `;
}

let briefingSlide = 0;
const BRIEFING_SLIDES = ['welcome', 'objectif', 'ateliers', 'atelier', 'groups', 'webapp', 'go'];

function renderBriefing() {
  const key      = BRIEFING_SLIDES[briefingSlide];
  const isFirst  = briefingSlide === 0;
  const isLast   = briefingSlide === BRIEFING_SLIDES.length - 1;
  const slide    = renderBriefingSlide(key);
  return `
    <div class="brief fade-in">
      ${slide}
      <div class="brief-nav">
        <button class="brief-nav-btn" data-brief-action="prev" ${isFirst ? 'disabled' : ''} aria-label="Précédent">‹</button>
        <div class="brief-nav-dots">
          ${BRIEFING_SLIDES.map((_, i) => `
            <button class="brief-nav-dot ${i === briefingSlide ? 'active' : ''}" data-brief-go="${i}" aria-label="Slide ${i+1}"></button>
          `).join('')}
        </div>
        <button class="brief-nav-btn" data-brief-action="next" ${isLast ? 'disabled' : ''} aria-label="Suivant">›</button>
        <button class="brief-nav-live" data-brief-action="live">Passer en direct →</button>
      </div>
    </div>
  `;
}

function renderBriefingSlide(key) {

    return `
      <div class="brief-slide">
        <div class="brief-welcome-centered">

          <h1 class="brief-welcome-title">Un instant<br/><em>de vérité</em></h1>
          <p class="brief-welcome-sub">
            Un moment pour se rencontrer, se poser, et choisir qui on veut être.

        <p class="brief-lead">

        <div class="brief-atelier-grid">

            <div class="brief-atelier-step-num">1</div>

          </div>

              <div class="brief-webapp-role-letter" style="font-style:normal">1</div>

            <div class="brief-webapp-role">
              <div class="brief-webapp-role-letter" style="font-style:normal">2</div>
              <div class="brief-webapp-role-content">
                <div class="brief-webapp-role-title">Choisissez votre groupe</div>
                <div class="brief-webapp-role-desc">

                </div>
              </div>
            </div>
            <div class="brief-webapp-role">
              <div class="brief-webapp-role-letter" style="font-style:normal">3</div>
              <div class="brief-webapp-role-content">
                <div class="brief-webapp-role-title">Suivez votre parcours</div>
                <div class="brief-webapp-role-desc">

  if (key === 'go') {
    return `
      <div class="brief-slide">

            L'instant commence maintenant.
